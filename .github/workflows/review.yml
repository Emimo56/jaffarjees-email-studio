name: Brand review

on:
  pull_request:
    paths:
      - "campaigns/**"

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Find changed campaign folders
        id: campaigns
        run: |
          git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=1
          folders=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- campaigns \
            | awk -F/ '{print $1 "/" $2}' | sort -u)
          {
            echo "folders<<EOF"
            echo "$folders"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Review changed campaigns
        if: steps.campaigns.outputs.folders != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          status=0
          while IFS= read -r folder; do
            [ -z "$folder" ] && continue
            echo "::group::Reviewing $folder"
            node scripts/review.mjs "$folder" || status=1
            echo "::endgroup::"
          done <<< "${{ steps.campaigns.outputs.folders }}"
          exit "$status"
